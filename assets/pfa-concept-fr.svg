        <text x="668" y="358" font-family="Arial,sans-serif" font-size="17" fill="#64747a">Apprentissage automatique</text>
        <path d="M 876 312 L 910 312" stroke="#4f6b5b" stroke-width="5" stroke-linecap="round"/><path d="M 898 301 L 912 312 L 898 323" fill="none" stroke="#4f6b5b" stroke-width="5"/>
        <rect x="925" y="230" width="230" height="165" rx="24" fill="#ffffff" stroke="#dce6e8" filter="url(#shadow)"/>
        <circle cx="961" cy="270" r="14" fill="#2878f0"/>
        <text x="953" y="325" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2926">Détection</text>
        <text x="953" y="358" font-family="Arial,sans-serif" font-size="17" fill="#64747a">Normal / attaque</text>
        
    <rect x="150" y="480" width="390" height="74" rx="37" fill="#26332e"/>
    <text x="345" y="527" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">Limiter les faux positifs</text>
    <rect x="660" y="480" width="390" height="74" rx="37" fill="#14213d"/>
    <text x="855" y="517" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Mieux détecter les attaques minoritaires</text>
    <text x="600" y="610" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#7a858a">Aucun résultat final n’est affiché tant qu’il n’est pas vérifié.</text>
    
</svg>
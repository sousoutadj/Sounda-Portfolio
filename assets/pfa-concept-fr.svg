        <text x="98" y="358" font-family="Arial,sans-serif" font-size="17" fill="#64747a">Capteurs &amp; variables</text>
        <path d="M 306 312 L 340 312" stroke="#4f6b5b" stroke-width="5" stroke-linecap="round"/><path d="M 328 301 L 342 312 L 328 323" fill="none" stroke="#4f6b5b" stroke-width="5"/>
        <rect x="355" y="230" width="230" height="165" rx="24" fill="#ffffff" stroke="#dce6e8" filter="url(#shadow)"/>
        <circle cx="391" cy="270" r="14" fill="#2878f0"/>

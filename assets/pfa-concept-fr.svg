        <path d="M 591 312 L 625 312" stroke="#4f6b5b" stroke-width="5" stroke-linecap="round"/><path d="M 613 301 L 627 312 L 613 323" fill="none" stroke="#4f6b5b" stroke-width="5"/>
        <rect x="640" y="230" width="230" height="165" rx="24" fill="#ffffff" stroke="#dce6e8" filter="url(#shadow)"/>
        <circle cx="676" cy="270" r="14" fill="#2878f0"/>
